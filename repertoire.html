<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>DIGIY ADMIN — Répertoire abonnés A→Z</title>
  <meta name="theme-color" content="#07140f" />
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
  <meta name="referrer" content="no-referrer" />
  <style>
    :root{--bg:#07140f;--card:#10241b;--card2:#0f1f19;--line:rgba(255,255,255,.09);--text:#ecfff4;--muted:rgba(236,255,244,.7);--soft:rgba(236,255,244,.52);--green:#22c55e;--green2:#16a34a;--gold:#facc15;--red:#ef4444;--amber:#f59e0b;--shadow:0 24px 70px rgba(0,0,0,.35);--radius:22px;--max:1180px}
    *{box-sizing:border-box}html,body{margin:0;background:linear-gradient(180deg,var(--bg),#06110d);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}a{color:inherit;text-decoration:none}button,input,select{font:inherit}.wrap{width:min(var(--max),calc(100% - 22px));margin:auto;padding:16px 0 70px}.hero,.card{border:1px solid var(--line);background:linear-gradient(180deg,var(--card),var(--card2));box-shadow:var(--shadow)}.hero{border-radius:28px;padding:19px;background:radial-gradient(circle at top right,rgba(34,197,94,.16),transparent 32%),linear-gradient(180deg,var(--card),var(--card2))}.eyebrow{display:inline-flex;padding:8px 11px;border-radius:999px;border:1px solid rgba(250,204,21,.22);background:rgba(250,204,21,.08);color:var(--gold);font-size:12px;font-weight:950}h1{margin:12px 0 7px;font-size:clamp(27px,5vw,44px);letter-spacing:-.035em}.lead{margin:0;color:var(--muted);line-height:1.55}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:14px;padding:11px 13px;font-weight:900;cursor:pointer}.btn-primary{background:linear-gradient(180deg,var(--green),var(--green2));color:#04110a}.btn-dark{background:#0a1511;color:var(--text);border:1px solid var(--line)}.card{margin-top:15px;border-radius:var(--radius);padding:15px}.status{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:#64748b}.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}.toolbar{display:grid;grid-template-columns:2fr 1fr auto;gap:9px;margin-top:13px}.toolbar input,.toolbar select{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(255,255,255,.04);color:var(--text);outline:none}.letters{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}.letter{min-width:34px;border:1px solid var(--line);border-radius:10px;padding:8px 9px;background:rgba(255,255,255,.035);color:var(--text);font-weight:900;cursor:pointer}.letter.active{background:var(--gold);color:#171303;border-color:transparent}.summary{margin-top:11px;color:var(--muted);font-size:13px}.groups{display:grid;gap:15px;margin-top:14px}.group{border-top:1px solid var(--line);padding-top:12px}.group:first-child{border-top:0;padding-top:0}.group-title{font-size:28px;font-weight:950;color:var(--gold);margin-bottom:8px}.list{display:grid;gap:9px}.person{border:1px solid var(--line);border-radius:17px;padding:12px;background:rgba(255,255,255,.03)}.top{display:flex;justify-content:space-between;gap:9px;align-items:flex-start;flex-wrap:wrap}.name{font-weight:950;font-size:17px}.sub{margin-top:3px;color:var(--muted);font-size:12px}.pills{display:flex;gap:6px;flex-wrap:wrap}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;border:1px solid var(--line);font-size:10px;font-weight:950}.pill.ok{color:#bbf7d0;background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.28)}.pill.warn{color:#fde68a;background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.28)}.pill.bad{color:#fecaca;background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.28)}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:9px}.cell{border:1px solid var(--line);border-radius:12px;padding:9px;background:rgba(0,0,0,.11)}.k{font-size:9px;text-transform:uppercase;color:var(--soft);font-weight:900;letter-spacing:.05em}.v{margin-top:4px;font-size:12px;font-weight:800;word-break:break-word}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.empty{border:1px dashed var(--line);border-radius:16px;padding:20px;text-align:center;color:var(--muted)}
    @media(max-width:800px){.meta{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}}@media(max-width:520px){.meta{grid-template-columns:1fr}.wrap{width:min(100% - 14px,1180px)}.btn{width:100%}}
  </style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="eyebrow">🦅 DIGIYLYFE — COCKPIT PRIVÉ</div>
    <h1>RÉPERTOIRE ABONNÉS — A → Z</h1>
    <p class="lead">Supabase reste la vérité centrale. Cette page ne copie aucune donnée : elle interroge le registre privé avec la session admin du cockpit.</p>
    <div class="actions"><a class="btn btn-dark" href="./">← Cockpit adhésions</a><button id="refreshBtn" class="btn btn-primary">🔄 Charger le répertoire</button></div>
  </section>

  <section class="card">
    <div class="status"><span id="dot" class="dot"></span><span id="status">Répertoire non chargé.</span></div>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Rechercher nom, téléphone ou UUID Supabase…" autocomplete="off" />
      <select id="state">
        <option value="all">Tous les états</option>
        <option value="active">Abonnements actifs</option>
        <option value="pending">En attente</option>
        <option value="refused">Refusés</option>
      </select>
      <button id="clearBtn" class="btn btn-dark">Effacer</button>
    </div>
    <div id="letters" class="letters"></div>
    <div id="summary" class="summary">0 dossier</div>
    <div id="groups" class="groups"><div class="empty">Connecte-toi d’abord au cockpit admin.</div></div>
  </section>
</div>
<script>
const API='https://wesqmwjjtsefyjnluosj.supabase.co/functions/v1/digiy-abonnes-repertoire';
const STORE={token:'digiy_admin_jwt',exp:'digiy_admin_exp'};
const $=id=>document.getElementById(id);
const els={dot:$('dot'),status:$('status'),refresh:$('refreshBtn'),search:$('search'),state:$('state'),clear:$('clearBtn'),letters:$('letters'),summary:$('summary'),groups:$('groups')};
let ABONNES=[];let ACTIVE_LETTER='ALL';
const collator=new Intl.Collator('fr',{sensitivity:'base',numeric:true});
function token(){return localStorage.getItem(STORE.token)||''}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function digits(v){return String(v||'').replace(/\D/g,'')}
function displayPhone(v){const d=digits(v);return d?(d.startsWith('221')?'+'+d:d):'—'}
function fmtDate(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleDateString('fr-FR')}
function normalized(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase()}
function firstLetter(v){const c=normalized(v).charAt(0);return /^[A-Z]$/.test(c)?c:'#'}
function statusBucket(d){if(String(d.payment_status)==='refuse'||String(d.status)==='refuse')return'refused';if(String(d.subscription_status)==='actif')return'active';return'pending'}
function pill(label,value){const s=String(value||'').toLowerCase();const cls=['actif','confirme','valide','validee','publiee'].includes(s)?'ok':['refuse','suspendu','resilie'].includes(s)?'bad':'warn';return `<span class="pill ${cls}">${esc(label)} : ${esc(value||'—')}</span>`}
function planLabel(d){const p=String(d.plan_code||'').toLowerCase();if(p.includes('19900'))return'ADHÉRENT 1 — 19 900 FCFA / 45 €';if(p.includes('28000'))return'ADHÉRENT — 28 000 FCFA / 75 €';return d.plan_code||'ADHÉSION'}
function buildLetters(){const letters=['ALL',...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];els.letters.innerHTML=letters.map(l=>`<button class="letter ${ACTIVE_LETTER===l?'active':''}" data-letter="${l}">${l==='ALL'?'TOUS':l}</button>`).join('');els.letters.querySelectorAll('[data-letter]').forEach(b=>b.addEventListener('click',()=>{ACTIVE_LETTER=b.dataset.letter;buildLetters();render()}))}
function currentRows(){const q=normalized(els.search.value);const st=els.state.value;return [...ABONNES].sort((a,b)=>collator.compare(a.pro_name||'',b.pro_name||'')||collator.compare(a.phone||'',b.phone||'')).filter(d=>ACTIVE_LETTER==='ALL'||firstLetter(d.pro_name)===ACTIVE_LETTER).filter(d=>st==='all'||statusBucket(d)===st).filter(d=>!q||normalized(`${d.pro_name||''} ${d.phone||''} ${d.whatsapp||''} ${d.id||''} ${d.job_label||''} ${d.zone_label||''}`).includes(q))}
function render(){if(!token()){els.groups.innerHTML='<div class="empty">Session admin absente. Ouvre le cockpit, connecte-toi, puis reviens ici.</div>';els.summary.textContent='0 dossier';return}const rows=currentRows();els.summary.textContent=`${rows.length} dossier${rows.length>1?'s':''} affiché${rows.length>1?'s':''} · ${ABONNES.length} dans le registre chargé`;if(!rows.length){els.groups.innerHTML='<div class="empty">Aucun dossier pour ce filtre.</div>';return}const groups=new Map();for(const d of rows){const l=firstLetter(d.pro_name);if(!groups.has(l))groups.set(l,[]);groups.get(l).push(d)}els.groups.innerHTML=[...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([letter,list])=>`<section class="group"><div class="group-title">${esc(letter)}</div><div class="list">${list.map(d=>{const phone=digits(d.phone),wa=digits(d.whatsapp||d.phone);return `<article class="person"><div class="top"><div><a class="name" href="dossier.html?id=${encodeURIComponent(d.id)}">${esc(d.pro_name||'Sans nom')}</a><div class="sub">${esc(d.job_label||'—')} · ${esc(d.zone_label||'—')}</div></div><div class="pills">${pill('Abonnement',d.subscription_status)}${pill('Paiement',d.payment_status)}</div></div><div class="meta"><div class="cell"><div class="k">Téléphone</div><div class="v">${phone?`<a href="tel:+${phone}">${esc(displayPhone(phone))}</a>`:'—'}</div></div><div class="cell"><div class="k">WhatsApp</div><div class="v">${wa?`<a href="https://wa.me/${wa}" target="_blank" rel="noreferrer">💬 ${esc(displayPhone(wa))}</a>`:'—'}</div></div><div class="cell"><div class="k">Offre</div><div class="v">${esc(planLabel(d))}</div></div><div class="cell"><div class="k">Échéance</div><div class="v">${esc(fmtDate(d.paid_until))}</div></div><div class="cell"><div class="k">UUID Supabase</div><div class="v mono">${esc(d.id)}</div></div><div class="cell"><div class="k">Entrée</div><div class="v">${esc(fmtDate(d.created_at))}</div></div></div></article>`}).join('')}</div></section>`).join('')}
async function load(){if(!token()){els.dot.className='dot bad';els.status.textContent='Session admin absente. Connecte-toi dans le cockpit.';render();return}els.refresh.disabled=true;els.refresh.textContent='Chargement…';els.dot.className='dot';els.status.textContent='Interrogation du registre Supabase…';try{const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token()}`},body:JSON.stringify({limit:5000}),credentials:'omit'});let data=null;try{data=await res.json()}catch{}if(res.status===401){throw new Error('Session admin expirée. Reconnecte-toi dans le cockpit.')}if(!res.ok||!data?.ok)throw new Error(data?.detail||data?.error||`HTTP ${res.status}`);ABONNES=Array.isArray(data.abonnes)?data.abonnes:[];els.dot.className='dot ok';els.status.textContent=`Répertoire chargé — ${ABONNES.length} dossier${ABONNES.length>1?'s':''}.`;render()}catch(e){els.dot.className='dot bad';els.status.textContent=String(e.message||e);els.groups.innerHTML='<div class="empty">Le répertoire n’a pas pu être chargé.</div>'}finally{els.refresh.disabled=false;els.refresh.textContent='🔄 Charger le répertoire'}}
els.refresh.addEventListener('click',load);els.search.addEventListener('input',render);els.state.addEventListener('change',render);els.clear.addEventListener('click',()=>{els.search.value='';els.state.value='all';ACTIVE_LETTER='ALL';buildLetters();render()});
buildLetters();render();if(token())load();
</script>
</body>
</html>
