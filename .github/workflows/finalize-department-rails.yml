name: Finalize department rails

on:
  push:
    paths:
      - '.github/workflows/finalize-department-rails.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark active department on each list
        run: |
          python - <<'PY'
          from pathlib import Path

          # ADHERENTS
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.btn-soft{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text)}',
                      '.btn-soft{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text)}.deptActive{outline:2px solid #fff3a6;box-shadow:0 0 0 4px rgba(250,204,21,.16),0 10px 28px rgba(0,0,0,.22)}',1)
          old='<a class="btn btn-gold" href="/">👥 ADHÉRENTS</a><a class="btn btn-gold" href="./partenaires-terrain.html">🤝 PARTENAIRES</a><a class="btn btn-gold" href="https://digiylyfe.com/digiy-campus-prive.html">🎓 CAMPUS</a>'
          new='<a class="btn btn-gold deptActive" href="/" aria-current="page">👥 ADHÉRENTS</a><a class="btn btn-gold" href="./partenaires-terrain.html">🤝 PARTENAIRES</a><a class="btn btn-gold" href="https://digiylyfe.com/digiy-campus-prive.html">🎓 CAMPUS</a>'
          if old in s:s=s.replace(old,new,1)
          elif 'aria-current="page">👥 ADHÉRENTS' not in s: raise SystemExit('Adherents rail target missing')
          s=s.replace('<h2 class="card-title">🟢 Adhésions</h2>','<h2 class="card-title">👥 Liste ADHÉRENTS</h2>',1)
          p.write_text(s,encoding='utf-8')

          # PARTENAIRES
          p=Path('partenaires-terrain.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.btn:disabled{opacity:.5}', '.btn:disabled{opacity:.5}.deptActive{outline:2px solid #fff3a6;box-shadow:0 0 0 4px rgba(250,204,21,.16),0 10px 28px rgba(0,0,0,.22)}',1)
          old='<a class="btn gold" href="/">👥 ADHÉRENTS</a><a class="btn gold" href="./partenaires-terrain.html">🤝 PARTENAIRES</a><a class="btn gold" href="https://digiylyfe.com/digiy-campus-prive.html">🎓 CAMPUS</a>'
          new='<a class="btn gold" href="/">👥 ADHÉRENTS</a><a class="btn gold deptActive" href="./partenaires-terrain.html" aria-current="page">🤝 PARTENAIRES</a><a class="btn gold" href="https://digiylyfe.com/digiy-campus-prive.html">🎓 CAMPUS</a>'
          if old in s:s=s.replace(old,new,1)
          elif 'aria-current="page">🤝 PARTENAIRES' not in s: raise SystemExit('Partners rail target missing')
          s=s.replace('<h1>PARTENAIRES TERRAIN</h1>','<h1>🤝 Liste PARTENAIRES</h1>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit department rails
        run: |
          if git diff --quiet -- index.html partenaires-terrain.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html partenaires-terrain.html
          git commit -m 'Finalize adherents and partners department lists'
          git push
