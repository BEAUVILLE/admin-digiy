name: Add permanent A-Z registers

on:
  push:
    paths:
      - '.github/workflows/add-permanent-registers.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add permanent registers to admin departments
        run: |
          python - <<'PY'
          from pathlib import Path

          def block(dept,title):
              return f'''\n<section id="permanentRegistry" data-dept="{dept}" class="card" style="margin-top:16px">\n  <div class="head card-head"><div class="registry-head"><div><h2 class="registry-title">📚 Registre permanent A → Z — {title}</h2><p class="registry-sub">Tous les dossiers restent visibles ici après validation ou refus.</p></div><div class="registry-tools"><span id="registryCount" class="registry-count">0</span><input id="registrySearch" class="registry-search" type="search" placeholder="Rechercher dans le registre…"><button id="registryRefresh" class="btn dark btn-dark" type="button">🔄 Actualiser</button></div></div></div>\n  <div class="body card-body"><div id="registryStatus" class="sub mini"></div><div id="registryList" class="registry-list"><div class="registry-empty">Connecte-toi pour charger le registre permanent.</div></div></div>\n</section>\n'''

          # ADHERENTS: full-width register after the working grid.
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if 'id="permanentRegistry"' not in s:
              marker='  <div class="footer-note">DIGIY ADMIN — la machine veille, l’humain valide.</div>'
              if marker not in s: raise SystemExit('ADHERENTS footer marker missing')
              s=s.replace(marker,block('adherents','ADHÉRENTS')+marker,1)
          if 'admin-registers.js' not in s:
              s=s.replace('</body>','<script src="./admin-registers.js?v=20260904-a-z-v1"></script>\n</body>',1)
          p.write_text(s,encoding='utf-8')

          # PARTNERS: register under current work lists.
          p=Path('partenaires-terrain.html'); s=p.read_text(encoding='utf-8')
          if 'id="permanentRegistry"' not in s:
              marker='</main></div><div class="foot">'
              if marker not in s: raise SystemExit('PARTNERS footer marker missing')
              s=s.replace(marker,'</main></div>'+block('partners','PARTENAIRES')+'<div class="foot">',1)
          if 'admin-registers.js' not in s:
              s=s.replace('</body>','<script src="./admin-registers.js?v=20260904-a-z-v1"></script>\n</body>',1)
          p.write_text(s,encoding='utf-8')

          # BONNE AFFAIRE: register under current work list.
          p=Path('bonne-affaire.html'); s=p.read_text(encoding='utf-8')
          if 'id="permanentRegistry"' not in s:
              marker='</main>\n</div><div class="foot">'
              if marker in s:
                  s=s.replace(marker,'</main>\n</div>'+block('bonne','BONNE AFFAIRE')+'<div class="foot">',1)
              else:
                  marker='</main></div><div class="foot">'
                  if marker not in s: raise SystemExit('BONNE AFFAIRE footer marker missing')
                  s=s.replace(marker,'</main></div>'+block('bonne','BONNE AFFAIRE')+'<div class="foot">',1)
          if 'admin-registers.js' not in s:
              s=s.replace('</body>','<script src="./admin-registers.js?v=20260904-a-z-v1"></script>\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit registers
        run: |
          if git diff --quiet -- index.html partenaires-terrain.html bonne-affaire.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html partenaires-terrain.html bonne-affaire.html
          git commit -m 'Add permanent A-Z registers to admin departments'
          git push
