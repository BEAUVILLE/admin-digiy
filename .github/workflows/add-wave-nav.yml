name: Add Wave ledger navigation

on:
  push:
    paths:
      - '.github/workflows/add-wave-nav.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Carnet Wave to admin navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          files = ['index.html','partenaires-terrain.html','bonne-affaire.html']
          for name in files:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if 'carnet-wave.html' in s:
                  continue
              needle='🏷️ BONNE AFFAIRE</a>'
              pos=s.find(needle)
              if pos < 0:
                  raise SystemExit(f'Navigation marker not found in {name}')
              pos += len(needle)
              cls='btn btn-gold' if name=='index.html' else 'btn gold'
              link=f'<a class="{cls}" href="./carnet-wave.html">💳 CARNET WAVE</a>'
              s=s[:pos]+link+s[pos:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit navigation
        run: |
          if git diff --quiet -- index.html partenaires-terrain.html bonne-affaire.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html partenaires-terrain.html bonne-affaire.html
          git commit -m 'Add Carnet Wave to admin navigation'
          git push
