name: DIGIY backup URI offline validation
on:
  pull_request:
    paths:
      - 'scripts/validate-backup-uri.py'
      - 'scripts/prepare-backup-connection.py'
      - 'tests/test_backup_secret_compat.py'
      - 'tests/test_backup_uri.py'
      - '.github/workflows/backup-uri-lint.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup-uri-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate URI diagnostics using synthetic values only
        run: python3 -m unittest discover -s tests -p 'test_backup*.py' -v
