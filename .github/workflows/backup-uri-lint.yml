name: DIGIY backup URI offline validation
on:
  pull_request:
    paths:
      - 'scripts/validate-backup-uri.py'
      - 'scripts/prepare-backup-connection.py'
      - 'tests/test_backup_secret_compat.py'
      - 'tests/test_backup_uri.py'
      - '.github/workflows/backup-uri-lint.yml'
      - 'scripts/restore-supabase-github-isolated.sh'
      - 'scripts/restore-local-auth-jwt.sql'
      - 'scripts/restore-local-auth-audit-ip.sql'
      - 'scripts/classify-restore-sql-failure.py'
      - 'tests/test_backup_restore_isolation.py'
      - 'tests/make-synthetic-backup.sh'
      - 'scripts/restore-from-downloaded-artifact-local.sh'
      - 'scripts/extract-encrypted-backup-zip.py'
      - 'tests/test_backup_local_artifact.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup-uri-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate URI diagnostics using synthetic values only
        run: python3 -m unittest discover -s tests -p 'test_backup*.py' -v

      - name: Inventory pinned Docker Auth schema only (zero user data or secrets)
        timeout-minutes: 5
        shell: bash
        run: |
          set -Eeuo pipefail
          name="digiy-auth-inventory-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run --rm -d --network none --name "$name" \
            -e POSTGRES_PASSWORD=synthetic-ci-only-not-a-real-secret \
            supabase/postgres:17.6.1.173 \
            postgres -c config_file=/etc/postgresql/postgresql.conf >/dev/null
          ready=NO
          for attempt in $(seq 1 60); do
            if docker exec "$name" pg_isready -U postgres -d postgres >/dev/null 2>&1; then
              ready=YES
              break
            fi
            sleep 2
          done
          test "$ready" = YES
          echo "PINNED_AUTH_CATALOG_BEGIN"
          docker exec "$name" psql -U postgres -d postgres -X -w -Atq -c "
            SELECT c.relname || '|' ||
                   string_agg(a.attname || ':' ||
                     format_type(a.atttypid, a.atttypmod), ','
                     ORDER BY a.attnum)
            FROM pg_class c
            JOIN pg_namespace n ON n.oid=c.relnamespace
            JOIN pg_attribute a ON a.attrelid=c.oid
              AND a.attnum>0 AND NOT a.attisdropped
            WHERE n.nspname='auth' AND c.relkind IN ('r','p')
            GROUP BY c.relname
            ORDER BY c.relname;"
          echo "PINNED_AUTH_CATALOG_END"

      - name: Probe official Supabase Auth migrations locally without network
        timeout-minutes: 10
        shell: bash
        run: |
          set -Eeuo pipefail
          name="digiy-auth-migrate-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run --rm -d --network none --name "$name" \
            -e POSTGRES_PASSWORD=synthetic-ci-only-not-a-real-secret \
            supabase/postgres:17.6.1.173 \
            postgres -c config_file=/etc/postgresql/postgresql.conf >/dev/null
          ready=NO
          for attempt in $(seq 1 60); do
            if docker exec "$name" pg_isready -U postgres -d postgres >/dev/null 2>&1; then
              ready=YES
              break
            fi
            sleep 2
          done
          test "$ready" = YES
          echo "OFFLINE_AUTH_MIGRATION_BEGIN"
          # Sharing the database container's --network none namespace exposes
          # loopback only. No route or hostname to DIGIY CORE exists.
          docker run --rm --network "container:$name" \
            -e DATABASE_URL="postgres://supabase_admin:synthetic-ci-only-not-a-real-secret@127.0.0.1:5432/postgres?sslmode=disable" \
            -e DB_NAMESPACE=auth \
            -e GOTRUE_DB_DRIVER=postgres \
            -e GOTRUE_JWT_SECRET=synthetic-ci-only-not-a-real-secret \
            supabase/gotrue:v2.197.0 auth migrate
          echo "OFFLINE_AUTH_MIGRATION_SUCCESS"
          echo "MIGRATED_AUTH_CATALOG_BEGIN"
          docker exec "$name" psql -U postgres -d postgres -X -w -Atq -c "
            SELECT c.relname || '|' ||
                   string_agg(a.attname || ':' ||
                   format_type(a.atttypid, a.atttypmod), ','
                   ORDER BY a.attnum)
            FROM pg_class c
            JOIN pg_namespace n ON n.oid=c.relnamespace
            JOIN pg_attribute a ON a.attrelid=c.oid
                AND a.attnum>0 AND NOT a.attisdropped
            WHERE n.nspname='auth' AND c.relkind IN ('r','p')
            GROUP BY c.relname ORDER BY c.relname;"
          echo "MIGRATED_AUTH_CATALOG_END"

      - name: Restore encrypted SYNTHETIC fixture inside Docker with no network
        timeout-minutes: 15
        shell: bash
        env:
          BACKUP_PASSPHRASE: synthetic-ci-only-not-a-real-secret
          CONFIRM_ISOLATED_RESTORE: "YES"
          SOURCE_ARTIFACT_DIR: ${{ runner.temp }}/synthetic-artifact
        run: |
          set -Eeuo pipefail
          bash tests/make-synthetic-backup.sh
          bash scripts/restore-supabase-github-isolated.sh

      - name: Reject wrong synthetic key and corrupted synthetic backup
        timeout-minutes: 3
        shell: bash
        env:
          BACKUP_PASSPHRASE: synthetic-ci-only-not-a-real-secret
          CONFIRM_ISOLATED_RESTORE: "YES"
          SOURCE_ARTIFACT_DIR: ${{ runner.temp }}/synthetic-artifact
        run: |
          set -Eeuo pipefail
          capture="$RUNNER_TEMP/synthetic-rejected-output.txt"
          if BACKUP_PASSPHRASE="synthetic-intentionally-wrong" \
             bash scripts/restore-supabase-github-isolated.sh >"$capture" 2>&1; then
            echo "::error::Expected decryption failure but restore succeeded"
            exit 1
          fi
          grep -q "ISOLATED_RESTORE_DECRYPT_FAILED" "$capture" || exit 1
          echo "SYNTHETIC_WRONG_KEY_REJECTED: OK"
          shopt -s nullglob
          archives=( "$SOURCE_ARTIFACT_DIR"/*.tar.gz.enc )
          [[ "${#archives[@]}" -eq 1 ]] || exit 1
          printf 'synthetic file corruption' >> "${archives[0]}"
          if bash scripts/restore-supabase-github-isolated.sh >"$capture" 2>&1; then
            echo "::error::Expected checksum failure but restore succeeded"
            exit 1
          fi
          grep -q "ISOLATED_RESTORE_ENCRYPTED_CHECKSUM_FAILED" "$capture" || exit 1
          echo "SYNTHETIC_CORRUPT_ARCHIVE_REJECTED: OK"
          rm -f "$capture"
