name: Bump admin registry v2

on:
  push:
    paths:
      - '.github/workflows/bump-register-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump registry asset version
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','partenaires-terrain.html','bonne-affaire.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=s.replace('admin-registers.js?v=20260904-a-z-v1','admin-registers.js?v=20260904-a-z-v2')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cache bust
        run: |
          if git diff --quiet -- index.html partenaires-terrain.html bonne-affaire.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html partenaires-terrain.html bonne-affaire.html
          git commit -m 'Load grouped admin registry v2'
          git push