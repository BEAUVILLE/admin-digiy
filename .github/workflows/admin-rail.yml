name: Add unified admin rail

on:
  push:
    paths:
      - '.github/workflows/admin-rail.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          # Main adhesions cockpit
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<a class="btn btn-gold" href="./partenaires-terrain.html">🤝 PARTENAIRES TERRAIN</a><a class="btn btn-gold" href="https://digiylyfe.com/digiy-campus-prive.html">🎓 CAMPUS</a>'
          new = '<a class="btn btn-gold" href="/">👥 ADHÉRENTS</a><a class="btn btn-gold" href="./partenaires-terrain.html">🤝 PARTENAIRES</a><a class="btn btn-gold" href="https://digiylyfe.com/digiy-campus-prive.html">🎓 CAMPUS</a>'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          elif new not in s:
              raise SystemExit('Main cockpit navigation target not found')

          # Partners cockpit
          p = Path('partenaires-terrain.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="nav"><a class="btn dark" href="/">← Adhésions</a><a class="btn gold" href="https://partenaire-terrain.digiylyfe.com/fiche-partenaire/" target="_blank" rel="noreferrer">🔎 Vérifier une fiche</a><button id="refreshTop" class="btn green">🔄 Actualiser</button></div>'
          new = '<div class="nav"><a class="btn gold" href="/">👥 ADHÉRENTS</a><a class="btn gold" href="./partenaires-terrain.html">🤝 PARTENAIRES</a><a class="btn gold" href="https://digiylyfe.com/digiy-campus-prive.html">🎓 CAMPUS</a><a class="btn dark" href="https://partenaire-terrain.digiylyfe.com/fiche-partenaire/" target="_blank" rel="noreferrer">🔎 Vérifier une fiche</a><button id="refreshTop" class="btn green">🔄 Actualiser</button></div>'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          elif new not in s:
              raise SystemExit('Partners cockpit navigation target not found')
          PY
      - name: Commit navigation
        run: |
          if git diff --quiet -- index.html partenaires-terrain.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html partenaires-terrain.html
          git commit -m 'Unify admin navigation across adhesions and partners'
          git push
