name: DIGIY RESTO — preuve restauration isolée PG17
on:
  pull_request:
    paths:
      - 'scripts/verify-resto-restored-snapshot.sh'
      - 'scripts/restore-supabase-github-isolated.sh'
      - 'scripts/backup-supabase.sh'
      - 'scripts/export-resto-owner-rpc-acl.sql'
      - 'tests/fixtures/resto-archive-synthetic-pg17.sql'
      - 'docs/RESTO_RESTORE_PRIVATE_GATE_20261010.md'
      - '.github/workflows/resto-isolated-restore-proof.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verify-resto-restored-snapshot.sh'
      - 'scripts/restore-supabase-github-isolated.sh'
      - 'tests/fixtures/resto-archive-synthetic-pg17.sql'
      - 'docs/RESTO_RESTORE_PRIVATE_GATE_20261010.md'
      - '.github/workflows/resto-isolated-restore-proof.yml'
permissions:
  contents: read
jobs:
  resto-restore-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax (Mac Bash 3.2 compatible)
        run: |
          bash -n scripts/restore-supabase-github-isolated.sh
          bash -n scripts/backup-supabase.sh
          bash -n scripts/restore-supabase-test.sh
          bash -n scripts/verify-supabase-backup.sh
          bash -n scripts/verify-resto-restored-snapshot.sh
      - name: Create throwaway PostgreSQL 17 without network
        run: |
          set -euo pipefail
          docker run --rm -d \
            --name digiy-restore-ci-resto \
            --network none \
            -e POSTGRES_PASSWORD=synthetic_test_only \
            postgres:17
          echo 'RESTO_SYNTHETIC_NO_NETWORK_CONTAINER_READY'
      - name: Populate synthetic restaurant shape
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if docker exec digiy-restore-ci-resto pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec -i digiy-restore-ci-resto psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 \
            < tests/fixtures/resto-archive-synthetic-pg17.sql
      - name: Positive RESTO snapshot proof
        run: |
          set -euo pipefail
          bash scripts/verify-resto-restored-snapshot.sh digiy-restore-ci-resto '4|2|2|7|10|8|0|0|2' "$RUNNER_TEMP"
      - name: Verify RESTO EXECUTE ACL archive roundtrip
        run: |
          set -euo pipefail
          # Synthetic catalog starts with PUBLIC EXECUTE, as a default
          # recreated by a schema-only dump. Explicitly revoke source grants.
          for f in \
            'digiy_resa_resto_claim_site_by_email_v1(text)' \
            'digiy_resa_resto_owner_refresh_no_shows_v1(uuid)' \
            'digiy_resa_resto_owner_set_booking_status_v1(uuid,text)'; do
            docker exec digiy-restore-ci-resto psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 -c \
              "REVOKE EXECUTE ON FUNCTION public.$f FROM PUBLIC,anon; GRANT EXECUTE ON FUNCTION public.$f TO authenticated,service_role;"
          done
          docker exec -i digiy-restore-ci-resto psql -U postgres -d postgres -X -qAt \
            -v ON_ERROR_STOP=1 < scripts/export-resto-owner-rpc-acl.sql \
            > "$RUNNER_TEMP/resto-owner-rpc-acl.sql"
          test "$(grep -c '^REVOKE ALL ON FUNCTION public.digiy_resa_resto_' "$RUNNER_TEMP/resto-owner-rpc-acl.sql")" = 3
          test "$(grep -c '^GRANT EXECUTE ON FUNCTION public.digiy_resa_resto_' "$RUNNER_TEMP/resto-owner-rpc-acl.sql")" = 3
          # Emulate CLI schema restore dropping a REVOKE: anon regains EXECUTE.
          for f in \
            'digiy_resa_resto_claim_site_by_email_v1(text)' \
            'digiy_resa_resto_owner_refresh_no_shows_v1(uuid)' \
            'digiy_resa_resto_owner_set_booking_status_v1(uuid,text)'; do
            docker exec digiy-restore-ci-resto psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 -c \
              "GRANT EXECUTE ON FUNCTION public.$f TO PUBLIC,anon;"
          done
          docker exec -i digiy-restore-ci-resto psql -U postgres -d postgres -X \
            -v ON_ERROR_STOP=1 < "$RUNNER_TEMP/resto-owner-rpc-acl.sql"
          result="$(docker exec digiy-restore-ci-resto psql -U postgres -d postgres -X -Atq \
            -c "SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND p.proname IN ('digiy_resa_resto_claim_site_by_email_v1','digiy_resa_resto_owner_refresh_no_shows_v1','digiy_resa_resto_owner_set_booking_status_v1') AND has_function_privilege('anon',p.oid,'EXECUTE')")"
          test "$result" = 0
          echo 'RESTO_SYNTHETIC_OWNER_ACL_ROUNDTRIP_OK: anon 0/3'
      - name: Reject source ACL drift (no backup allowed)
        run: |
          set -euo pipefail
          docker exec digiy-restore-ci-resto psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 -c \
            'GRANT EXECUTE ON FUNCTION public.digiy_resa_resto_claim_site_by_email_v1(text) TO PUBLIC'
          if docker exec -i digiy-restore-ci-resto psql -U postgres -d postgres -X -qAt \
            -v ON_ERROR_STOP=1 < scripts/export-resto-owner-rpc-acl.sql > /dev/null 2>&1; then
            echo 'FAIL: unsafe source RPC grant did not block backup'
            exit 1
          fi
          docker exec digiy-restore-ci-resto psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 -c \
            'REVOKE EXECUTE ON FUNCTION public.digiy_resa_resto_claim_site_by_email_v1(text) FROM PUBLIC'
          echo 'RESTO_SYNTHETIC_UNSAFE_BACKUP_REJECTED'
      - name: Refuse altered aggregate without changing any records
        run: |
          set -euo pipefail
          if bash scripts/verify-resto-restored-snapshot.sh digiy-restore-ci-resto '4|2|2|7|11|8|0|0|2' "$RUNNER_TEMP"; then
            echo 'INVALID: altered baseline was accepted'
            exit 1
          fi
      - name: Refuse missing RLS, repair only synthetic fixture afterward
        run: |
          set -euo pipefail
          docker exec digiy-restore-ci-resto psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 -c \
            'ALTER TABLE public.digiy_resa_resto_bookings DISABLE ROW LEVEL SECURITY'
          if bash scripts/verify-resto-restored-snapshot.sh digiy-restore-ci-resto '4|2|2|7|10|8|0|0|2' "$RUNNER_TEMP"; then
            echo 'INVALID: missing booking RLS was accepted'
            exit 1
          fi
          docker exec digiy-restore-ci-resto psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 -c \
            'ALTER TABLE public.digiy_resa_resto_bookings ENABLE ROW LEVEL SECURITY'
      - name: Refuse missing RPC, restore only synthetic function afterward
        run: |
          set -euo pipefail
          docker exec digiy-restore-ci-resto psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 -c \
            'DROP FUNCTION public.digiy_resa_resto_public_availability_v1(text,date,integer,text)'
          if bash scripts/verify-resto-restored-snapshot.sh digiy-restore-ci-resto '4|2|2|7|10|8|0|0|2' "$RUNNER_TEMP"; then
            echo 'INVALID: missing public RESTO RPC was accepted'
            exit 1
          fi
      - name: Destroy throwaway container
        if: always()
        run: docker rm -f digiy-restore-ci-resto >/dev/null 2>&1 || true
