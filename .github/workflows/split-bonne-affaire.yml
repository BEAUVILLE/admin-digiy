name: Split BONNE AFFAIRE department

on:
  push:
    paths:
      - '.github/workflows/split-bonne-affaire.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Separate BONNE AFFAIRE from ADHERENTS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Main ADHERENTS page: add 4th department and remove BONNE AFFAIRE visible block.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<a class="btn btn-gold deptActive" href="/" aria-current="page">👥 ADHÉRENTS</a><a class="btn btn-gold" href="./partenaires-terrain.html">🤝 PARTENAIRES</a><a class="btn btn-gold" href="https://digiylyfe.com/digiy-campus-prive.html">🎓 CAMPUS</a>'
          new=old+'<a class="btn btn-gold" href="./bonne-affaire.html">🏷️ BONNE AFFAIRE</a>'
          if old in s and './bonne-affaire.html' not in s:
              s=s.replace(old,new,1)
          s2,n=re.subn(r'\n\s*<section class="card ba-full">.*?</section>', '', s, count=1, flags=re.S)
          if n==0 and 'BONNE AFFAIRE — Paiements & annonces' in s:
              raise SystemExit('Could not isolate BONNE AFFAIRE section in index.html')
          p.write_text(s2,encoding='utf-8')

          # PARTNERS rail: add BONNE AFFAIRE.
          p=Path('partenaires-terrain.html')
          s=p.read_text(encoding='utf-8')
          old='<a class="btn gold" href="/">👥 ADHÉRENTS</a><a class="btn gold deptActive" href="./partenaires-terrain.html" aria-current="page">🤝 PARTENAIRES</a><a class="btn gold" href="https://digiylyfe.com/digiy-campus-prive.html">🎓 CAMPUS</a>'
          new=old+'<a class="btn gold" href="./bonne-affaire.html">🏷️ BONNE AFFAIRE</a>'
          if old in s and './bonne-affaire.html' not in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # ADHERENTS controller: BONNE AFFAIRE functions become harmless if their DOM is absent.
          p=Path('admin-cockpit-v2.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('function renderBonneAffaire(){\n  const f=', 'function renderBonneAffaire(){\n  if(!els.baList)return;\n  const f=',1)
          s=s.replace('async function refreshBonneAffaire(){if(!token())', 'async function refreshBonneAffaire(){if(!els.baList)return;if(!token())',1)
          s=s.replace("els.baRefresh.addEventListener('click',refreshBonneAffaire);els.baFilter.addEventListener('change',renderBonneAffaire);", "if(els.baRefresh)els.baRefresh.addEventListener('click',refreshBonneAffaire);if(els.baFilter)els.baFilter.addEventListener('change',renderBonneAffaire);",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit separation
        run: |
          if git diff --quiet -- index.html partenaires-terrain.html admin-cockpit-v2.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html partenaires-terrain.html admin-cockpit-v2.js
          git commit -m 'Separate BONNE AFFAIRE from ADHERENTS department'
          git push
