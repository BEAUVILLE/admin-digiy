<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#07140f">
<title>DIGIY ADMIN — Dossier terrain</title>
<style>
:root{--bg:#07140f;--card:#10241b;--line:#ffffff18;--text:#ecfff4;--muted:#ecfff4b8;--green:#22c55e;--gold:#facc15;--red:#ef4444;--warn:#f59e0b;--cyan:#2dd4bf}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--bg),#06110d);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.w{width:min(780px,calc(100% - 16px));margin:auto;padding:10px 0 42px}.hero,.card{border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,#10241b,#0f1f19);box-shadow:0 18px 50px #0006}.hero{padding:18px;margin-bottom:12px}.ey{color:var(--gold);font-size:12px;font-weight:950}.hero h1{margin:8px 0 6px;font-size:clamp(27px,7vw,40px);line-height:1}.sub,.mini{color:var(--muted);line-height:1.5}.card{padding:15px}.stack{display:grid;gap:11px}.hidden{display:none!important}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:14px;padding:13px 14px;font-weight:950;cursor:pointer;text-align:center}.btn-green{background:var(--green);color:#04110a}.btn-red{background:var(--red);color:#fff}.btn-gold{background:var(--gold);color:#171303}.btn-dark{background:#ffffff0b;color:var(--text);border:1px solid var(--line)}input,textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;background:#07140f;color:var(--text);font:inherit}textarea{min-height:82px;resize:vertical}label{display:grid;gap:6px;color:var(--muted);font-size:13px}.status{padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:#ffffff08;font-size:13px}.ok{border-color:#22c55e55;background:#22c55e10}.bad{border-color:#ef444455;background:#ef444410}.warn{border-color:#f59e0b55;background:#f59e0b10}.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}.title{margin:0;font-size:23px}.pill{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:950;border:1px solid var(--line)}.pill.ok{color:#bbf7d0}.pill.warn{color:#fde68a}.pill.bad{color:#fecaca}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cell{border:1px solid var(--line);border-radius:14px;padding:10px;background:#0002}.k{font-size:10px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.05em}.v{margin-top:4px;font-weight:850;word-break:break-word}.geo,.services,.prest{border:1px solid var(--line);border-radius:15px;padding:11px;background:#0002}.geo{border-color:#38bdf855;background:#38bdf80b}.services ol{margin:7px 0 0;padding-left:20px}.prest{border-color:#2dd4bf55;background:#2dd4bf0d}.prest-item{margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:13px}.media{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mediaBox{border:1px solid var(--line);border-radius:15px;padding:10px;background:#0002}.mediaBox img{width:100%;max-height:260px;object-fit:contain;border-radius:10px}.actions{border-top:1px solid var(--line);padding-top:12px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}a{color:#d5fff8}@media(max-width:620px){.grid,.media{grid-template-columns:1fr}.btn{width:100%}}
</style>
</head>
<body><main class="w">
<section class="hero"><div class="ey">📱 DIGIYLYFE — BUREAU TERRAIN</div><h1>Dossier à contrôler</h1><div class="sub">Ouvert depuis WhatsApp. Pays, territoire, devise et couverture sont lus depuis le dossier réel. La décision reste humaine.</div></section>
<section class="card stack">
<div id="invalid" class="status bad hidden">Lien dossier invalide.</div>
<div id="login" class="stack hidden"><label>PIN admin<input id="pin" type="password" inputmode="numeric" autocomplete="one-time-code" placeholder="PIN"></label><button id="loginBtn" class="btn btn-green">🔐 OUVRIR CE DOSSIER</button></div>
<div id="session" class="status hidden"></div>
<div id="loading" class="status hidden">Chargement du dossier…</div>
<div id="out"></div>
<div class="row"><a class="btn btn-dark" href="/">← Cockpit complet</a><button id="backBtn" class="btn btn-dark" type="button">↩ Retour WhatsApp</button></div>
</section></main>
<script>
const BACKEND='https://admin.digiylyfe.com';
const API='https://wesqmwjjtsefyjnluosj.supabase.co/functions/v1/digiy-adhesion-cockpit';
const STORE={token:'digiy_admin_jwt',exp:'digiy_admin_exp',role:'digiy_admin_role',label:'digiy_admin_label'};
const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
const $=id=>document.getElementById(id),ID=String(new URLSearchParams(location.search).get('id')||'').trim();let CURRENT=null;
function tok(){return localStorage.getItem(STORE.token)||''}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function money(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString('fr-FR'):'—'}
function date(v){if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('fr-FR')}
function digits(v){return String(v||'').replace(/\D/g,'')}
function currencyLabel(c){c=String(c||'').toUpperCase();return c==='XOF'?'FCFA':c==='EUR'?'€':c||'—'}
function amountOf(d){const n=Number(d?.price_amount);if(Number.isFinite(n))return n;const c=String(d?.currency_code||'').toUpperCase();const legacy=Number(c==='EUR'?d?.price_eur:d?.price_xof);return Number.isFinite(legacy)?legacy:null}
function plan(d){const p=String(d?.plan_code||'').toLowerCase();const name=p.includes('19900')?'ADHÉRENT 1':p.includes('28000')?'ADHÉRENT':(d?.plan_code||'ADHÉSION');const a=amountOf(d),c=currencyLabel(d?.currency_code);return a===null?name:`${name} — ${money(a)} ${c}`}
function cls(v){v=String(v||'').toLowerCase();return['confirme','valide','validee','publiee','actif'].includes(v)?'ok':['refuse','suspendu','resilie'].includes(v)?'bad':'warn'}
function arr(v){return Array.isArray(v)?v:[]}
function saveSession(d){if(d?.token)localStorage.setItem(STORE.token,d.token);if(d?.exp)localStorage.setItem(STORE.exp,String(d.exp));if(d?.role)localStorage.setItem(STORE.role,d.role);if(d?.label)localStorage.setItem(STORE.label,d.label)}
function clearSession(){Object.values(STORE).forEach(k=>localStorage.removeItem(k))}
async function backend(path,opt={}){const h=new Headers(opt.headers||{});if(!h.has('Content-Type'))h.set('Content-Type','application/json');if(tok())h.set('Authorization','Bearer '+tok());const r=await fetch(BACKEND+path,{method:opt.method||'GET',headers:h,body:opt.body,credentials:'include'});let d=null;try{d=await r.json()}catch{}return{r,d}}
async function call(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok()},body:JSON.stringify({action,...payload}),credentials:'omit'});let d=null;try{d=await r.json()}catch{}return{r,d}}
function showLogin(){$('login').classList.remove('hidden');$('session').classList.add('hidden');$('out').innerHTML=''}
async function login(){const pin=$('pin').value.trim();if(!pin)return;$('loginBtn').disabled=true;try{const{r,d}=await backend('/api/admin/login',{method:'POST',body:JSON.stringify({pin,ua:navigator.userAgent||''})});if(!r.ok||!d?.ok)throw new Error(d?.error||'Connexion refusée');saveSession(d);$('login').classList.add('hidden');await start()}catch(e){alert(e.message||String(e))}finally{$('loginBtn').disabled=false}}
function serviceBlock(d){const rows=arr(d.service_requests);if(!rows.length)return'';return `<div class="prest"><strong>PRESTATION DIGIYLYFE DEMANDÉE</strong>${rows.map(s=>{const type=String(s.request_type||'').toLowerCase(),det=String(s.details||'').toUpperCase();const label=type==='fiche'?'📄 FICHE PERSONNALISÉE':det.includes('EXTRA')?'🚀 SITE EXTRA':det.includes('PREMIUM')?'⭐ SITE PREMIUM':'🌐 SITE';const n=Number(s.starting_price_amount),legacy=Number(s.starting_price_xof),amount=Number.isFinite(n)?n:Number.isFinite(legacy)?legacy:null,c=s.currency_code||(Number.isFinite(n)?d.currency_code:'XOF');return `<div class="prest-item"><strong>${esc(label)}</strong><div class="mini">${amount===null?'Tarif à préciser':`À partir de ${money(amount)} ${esc(currencyLabel(c))}`} · ${esc(String(s.status||'nouvelle').toUpperCase())}</div></div>`}).join('')}</div>`}
function geographyBlock(d){const sz=arr(d.service_zone_ids),st=arr(d.service_territory_ids);return `<div class="geo"><strong>🌍 GÉOGRAPHIE CORE</strong><div class="grid" style="margin-top:8px"><div class="cell"><div class="k">Pays</div><div class="v">${esc(d.country_id||'Ancien dossier')}</div></div><div class="cell"><div class="k">Territoire</div><div class="v">${esc(d.territory_id||'—')}</div></div><div class="cell"><div class="k">Zone de base</div><div class="v">${esc(d.base_zone_id||d.zone_label||'—')}</div></div><div class="cell"><div class="k">Devise / indicatif</div><div class="v">${esc(d.currency_code||'—')} · ${esc(d.calling_code||'—')}</div></div><div class="cell"><div class="k">Fuseau</div><div class="v">${esc(d.timezone||'—')}</div></div><div class="cell"><div class="k">Couverture</div><div class="v">${st.length?`Territoire : ${esc(st.join(', '))}`:sz.length?`Zones : ${esc(sz.join(', '))}`:'Zone de base uniquement'}</div></div></div></div>`}
function render(d){CURRENT=d;const phone=digits(d.phone),wa=digits(d.whatsapp||d.phone),services=[d.service_1,d.service_2,d.service_3,d.service_4].filter(Boolean),can=String(d.payment_status)==='a_confirmer',paid=String(d.payment_status)==='confirme';$('out').innerHTML=`<div class="stack"><div class="top"><div><h2 class="title">${esc(d.pro_name||'Sans nom')}</h2><div class="mini">${esc(d.job_label||'—')} · ${esc(d.zone_label||'—')}</div></div><span class="pill ${cls(d.payment_status)}">Paiement : ${esc(d.payment_status||'—')}</span></div><div class="grid"><div class="cell"><div class="k">Forfait</div><div class="v">${esc(plan(d))}</div></div><div class="cell"><div class="k">Reçu le</div><div class="v">${esc(date(d.created_at))}</div></div><div class="cell"><div class="k">Téléphone</div><div class="v">${phone?`<a href="tel:+${phone}">+${phone}</a>`:'—'}</div></div><div class="cell"><div class="k">WhatsApp client</div><div class="v">${wa?`<a href="https://wa.me/${wa}" target="_blank" rel="noreferrer">💬 +${wa}</a>`:'—'}</div></div><div class="cell"><div class="k">Dossier</div><div class="v">${esc(d.status||'—')}</div></div><div class="cell"><div class="k">Carte</div><div class="v">${esc(d.card_status||'—')}</div></div></div>${geographyBlock(d)}<div class="services"><strong>SERVICES</strong><ol>${services.length?services.map(s=>`<li>${esc(s)}</li>`).join(''):'<li>Non renseigné</li>'}</ol></div>${serviceBlock(d)}<div class="media"><div class="mediaBox"><strong>Photo</strong>${d.photo_preview_url?`<a href="${esc(d.photo_preview_url)}" target="_blank" rel="noreferrer"><img src="${esc(d.photo_preview_url)}" alt="Photo"></a>`:'<div class="mini">Aucune photo.</div>'}</div><div class="mediaBox"><strong>Preuve de paiement</strong>${d.payment_proof_url?`<a class="btn btn-gold" style="display:block;margin-top:9px" href="${esc(d.payment_proof_url)}" target="_blank" rel="noreferrer">👁️ VOIR LA PREUVE</a>`:'<div class="mini">Aucune preuve.</div>'}</div></div><div class="cell"><div class="k">ID dossier</div><div class="v mono">${esc(d.id)}</div></div><div class="actions stack">${can?`<label>Note admin · facultative<textarea id="note" placeholder="Ex : preuve contrôlée."></textarea></label><button class="btn btn-green" data-act="confirm">✅ CONFIRMER LE PAIEMENT · ${esc(plan(d))}</button><button class="btn btn-red" data-act="reject">⛔ REFUSER LE PAIEMENT</button>`:paid?'<div class="status ok">✅ Paiement déjà confirmé. Le dossier peut passer en fabrication.</div>':'<div class="status warn">Aucune décision de paiement disponible dans cet état.</div>'}</div></div>`;$('out').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>decide(b.dataset.act,b))}
async function load(){$('loading').classList.remove('hidden');try{const{r,d}=await call('list',{limit:100});if(r.status===401){clearSession();showLogin();return}if(!r.ok||!d?.ok)throw new Error(d?.detail||d?.error||'Chargement impossible');const row=(d.dossiers||[]).find(x=>String(x.id)===ID);if(!row)throw new Error('Dossier introuvable dans les 100 dernières demandes.');render(row)}catch(e){$('out').innerHTML=`<div class="status bad">${esc(e.message||String(e))}</div>`}finally{$('loading').classList.add('hidden')}}
async function decide(act,btn){if(!CURRENT)return;const yes=act==='confirm';if(!confirm(yes?`Confirmer le paiement de ${CURRENT.pro_name} ?\n${plan(CURRENT)}\n${CURRENT.country_id||''} · ${CURRENT.territory_id||''}`:`REFUSER le paiement de ${CURRENT.pro_name} ?`))return;btn.disabled=true;try{const payload={id:ID,note:String($('note')?.value||'').trim()};if(yes){payload.currency=String(CURRENT.currency_code||'XOF').toUpperCase();payload.amount=amountOf(CURRENT);payload.payment_method='validation WhatsApp cockpit terrain'}const{r,d}=await call(yes?'payment_confirm':'payment_reject',payload);if(!r.ok||!d?.ok)throw new Error(d?.detail||d?.error||'Décision non enregistrée');alert(yes?`Paiement confirmé · ${esc(d?.payment?.amount??amountOf(CURRENT))} ${esc(currencyLabel(d?.payment?.currency||CURRENT.currency_code))}`:'Paiement refusé.');await load()}catch(e){alert(e.message||String(e))}finally{btn.disabled=false}}
async function start(){if(!UUID.test(ID)){$('invalid').classList.remove('hidden');return}if(!tok()){showLogin();return}const{r,d}=await backend('/api/admin/check');if(!r.ok||!d?.ok){clearSession();showLogin();return}$('session').classList.remove('hidden');$('session').className='status ok';$('session').textContent=`Session valide · ${d.role||localStorage.getItem(STORE.role)||'ADMIN'} · ${d.label||localStorage.getItem(STORE.label)||''}`;$('login').classList.add('hidden');await load()}
$('loginBtn').onclick=login;$('pin').onkeydown=e=>{if(e.key==='Enter')login()};$('backBtn').onclick=()=>history.length>1?history.back():location.href='/';start();
</script></body></html>
